name: Testing

on:
  workflow_call:

jobs:
  testing:
    name: Code testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pdm update && pdm sync -d -G testing
      - name: Run code analysis (package)
        run: pdm run -v mypy ./mandalore/ --ignore-missing-imports --check-untyped-defs --pretty # TODO add --disallow-untyped-defs
      - name: Run code analysis (source)
        run: pdm run -v mypy ./mandalore.py --ignore-missing-imports --check-untyped-defs --pretty # TODO add --disallow-untyped-defs
      - name: Run unit tests
        run: pdm run -v pytest
      - name: Find spawn.sh script version
        run: egrep '^# Spawn Version:[0-9ab]+$' ./mandalore/utils/imgsync/spawn.sh | cut -d ':' -f2
      - name: Pre-commit checks
        run: pdm run -v pre-commit run --all-files --hook-stage pre-commit

  compatibility:
    name: Compatibility checks
    runs-on: ubuntu-latest
    needs: testing
    strategy:
      fail-fast: false
      matrix:
        version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [win32, linux, darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pdm update && pdm sync -d -G testing
      - name: Check python compatibility for ${{ matrix.os }}/${{ matrix.version }}
        run: pdm run -v mypy ./mandalore.py --ignore-missing-imports --check-untyped-defs --python-version ${{ matrix.version }} --platform ${{ matrix.os }}

