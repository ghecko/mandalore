  build-n-install:
    name: Build and install Python 🐍 package 📦
    runs-on: ubuntu-latest
    needs: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Submodules are private repositories: they are not needed to build the wrapper package
          submodules: false
      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4.6
        with:
          python-version: "3.12"
      - name: Build Mandalore
        run: pdm build
      - name: Create testing venv
        run: pdm venv create -n vtest-source --with-pip && pdm venv create -n vtest-wheel --with-pip
      - name: Install pip source package
        run: pdm run --venv vtest-source -v pip install ./dist/*.tar.gz
      - name: Install pip source package
        run: pdm run --venv vtest-wheel -v pip install ./dist/*.tar.gz
