name: Feature request [WRAPPER]
description: Suggest an idea for the Mandalore WRAPPER command
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Verification before publication:

        - You are creating a feature request in the Mandalore **WRAPPER** repository (the mandalore command)!
        > If your request concerns the mandalore environment, tools or other elements specific to the Mandalore **IMAGE**, please open your issue on the [Mandalore-images](https://github.com/ghecko/mandalore-images) repository.
        - Check that there is not already your feature request on the Mandalore **roadmap** (can be consulted in the **documentation**)

  - type: textarea
    attributes:
      label: The needs
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: false
  - type: textarea
    attributes:
      label: Description
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
